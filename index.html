    <script>
      (function() {
        try {
          var saved = localStorage.getItem('m3_portfolio_theme');
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && systemDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

  <body class="bg-[var(--md-sys-color-surface)] text-[var(--md-sys-color-on-surface)] antialiased min-h-screen selection:bg-[var(--md-sys-color-primary-container)] selection:text-[var(--md-sys-color-on-primary-container)]">
